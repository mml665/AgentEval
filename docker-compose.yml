services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: agenteval
      POSTGRES_USER: agenteval
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenteval -d agenteval"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AGENTEVAL_API_TOKEN: ${AGENTEVAL_API_TOKEN:?Set AGENTEVAL_API_TOKEN in .env}
      AGENTEVAL_DATABASE_URL: postgresql+psycopg://agenteval:${POSTGRES_PASSWORD}@db:5432/agenteval
      AGENTEVAL_HTTP_ALLOWLIST: ${AGENTEVAL_HTTP_ALLOWLIST:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  postgres-data:

