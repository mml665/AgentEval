name: Core evaluation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.lock
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: console-browser-failures
          path: .build/playwright-results
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pytest -q
      - run: python scripts/smoke.py
      - run: python scripts/v05_smoke.py
      - run: python scripts/product_smoke.py
  postgres:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agenteval
          POSTGRES_PASSWORD: ci-ephemeral-password
          POSTGRES_DB: agenteval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenteval" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PYTHONPATH: backend
      AGENTEVAL_DATABASE_URL: postgresql+psycopg://agenteval:ci-ephemeral-password@127.0.0.1:5432/agenteval
      AGENTEVAL_QUEUE_DATABASE_URL: postgresql+psycopg://agenteval:ci-ephemeral-password@127.0.0.1:5432/agenteval
      AGENTEVAL_TEST_BROKER_URL: redis://127.0.0.1:6379/0
      AGENTEVAL_PRODUCT_DATABASE_URL: postgresql+psycopg://agenteval:ci-ephemeral-password@127.0.0.1:5432/agenteval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m agenteval init-db
      - run: python -m agenteval init-db
      - run: python scripts/queue_smoke.py
      - run: python scripts/product_smoke.py

